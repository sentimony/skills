name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          errors = []
          for skill_md in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill_md.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{skill_md}: missing YAML frontmatter")
                  continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(\S+)\s*$", fm, re.MULTILINE)
              if not name:
                  errors.append(f"{skill_md}: missing 'name'")
              elif name.group(1) != skill_md.parent.name:
                  errors.append(f"{skill_md}: name '{name.group(1)}' != directory '{skill_md.parent.name}'")
              if not re.search(r"^description:\s*\S", fm, re.MULTILINE):
                  errors.append(f"{skill_md}: missing 'description'")
              if not re.search(r'^\s*version:\s*"\d+\.\d+\.\d+"\s*$', fm, re.MULTILINE):
                  errors.append(f"{skill_md}: metadata.version must be plain semver X.Y.Z")

          for err in errors:
              print(f"::error::{err}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Compile Python scripts and examples
        run: |
          python -m compileall -q skills/*/scripts skills/*/examples

      - name: Run skill test suites
        run: |
          set -e
          for test in $(find skills -name 'test_*.py' | sort); do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Check for hidden/bidirectional Unicode
        run: |
          # The whole Unicode Bidi_Control property plus the zero-width characters and
          # the byte order mark. Keep in step with INVISIBLE_CODEPOINT_CLASS in
          # skills/vitest/scripts/run_vitest.py, which forbids the same set at runtime.
          pattern='[\x{061C}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}\x{FEFF}]'

          # Positive control first. This scan passes by finding nothing, so a pattern or
          # a flag that stops matching makes it silently vacuous rather than noisy - the
          # -I and --exclude-dir below were added reactively and could have done exactly
          # that. The control file lives outside the checkout so the real scan never sees it.
          control="$RUNNER_TEMP/bidi-positive-control.txt"
          python -c "import sys; open(sys.argv[1], 'w', encoding='utf-8').write('before\u202eafter\n')" "$control"
          if ! grep -qPI "$pattern" "$control"; then
            echo "::error::hidden-Unicode scan does not match its own positive control"
            exit 1
          fi

          # -I and --exclude-dir skip build artifacts: compiling and running the
          # suites leaves .pyc files in which a source-level \uXXXX escape appears
          # as the literal codepoint. The check is about source, not bytecode.
          #
          # The exit codes are separated rather than negated with `! grep`, which reports
          # success for both "found nothing" (1) and "the scanner failed" (2) - an
          # unreadable file or a pattern grep rejects would have passed as clean.
          status=0
          grep -rnPI --exclude-dir=__pycache__ "$pattern" skills README.md AGENTS.md CHANGELOG.md || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::hidden or bidirectional Unicode found in the files listed above"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::hidden-Unicode scan failed with exit status $status"
            exit 1
          fi
