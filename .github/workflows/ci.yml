name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          errors = []
          for skill_md in sorted(pathlib.Path("plugins").glob("*/skills/*/SKILL.md")):
              text = skill_md.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{skill_md}: missing YAML frontmatter")
                  continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(\S+)\s*$", fm, re.MULTILINE)
              if not name:
                  errors.append(f"{skill_md}: missing 'name'")
              elif name.group(1) != skill_md.parent.name:
                  errors.append(f"{skill_md}: name '{name.group(1)}' != directory '{skill_md.parent.name}'")
              if not re.search(r"^description:\s*\S", fm, re.MULTILINE):
                  errors.append(f"{skill_md}: missing 'description'")
              if re.search(r"^  (version|author):", fm, re.MULTILINE):
                  errors.append(f"{skill_md}: skills are not versioned individually; drop metadata.version and metadata.author")
              hint = re.search(r"^argument-hint:(.*)$", fm, re.MULTILINE)
              if hint:
                  value = hint.group(1).strip().strip("\"'").strip()
                  depth = 0
                  for ch in value:
                      depth += {"[": 1, "]": -1}.get(ch, 0)
                      if depth < 0:
                          break
                  if not value or value[0] in "|>" or depth != 0 or value.count("<") != value.count(">"):
                      errors.append(f"{skill_md}: argument-hint must be a non-empty single line with balanced [] and <>")
          if not any(pathlib.Path("plugins").glob("*/skills/*/SKILL.md")):
              errors.append("no plugins/*/skills/*/SKILL.md found")

          for err in errors:
              print(f"::error::{err}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Check plugin manifests and marketplace
        run: |
          python - <<'EOF'
          import json, pathlib, re, sys

          errors = []
          root = pathlib.Path("plugins")
          # Every plugin version tracks the newest release in the repository CHANGELOG.
          release = re.search(r"^## \[(\d+\.\d+\.\d+)\]", pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8"), re.MULTILINE)
          release = release and release.group(1)
          if pathlib.Path("skills").exists():
              errors.append("top-level skills/ must not exist: skills live in plugins/<plugin>/skills/")
          for stale in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              if pathlib.Path(stale).exists():
                  errors.append(f"{stale} must not exist: each plugin has its own manifests")

          plugin_dirs = sorted(p.name for p in root.iterdir() if p.is_dir()) if root.is_dir() else []
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          names = [e.get("name") for e in market.get("plugins", [])]
          if len(names) != len(set(names)):
              errors.append(f"marketplace.json has duplicate plugin names: {names}")
          entries = {e.get("name"): e.get("source") for e in market.get("plugins", [])}
          if sorted(entries) != plugin_dirs:
              errors.append(f"marketplace.json plugins {sorted(entries)} != plugins/ directories {plugin_dirs}")
          for name, source in entries.items():
              if source != f"./plugins/{name}":
                  errors.append(f"marketplace.json plugin {name}: source {source!r} != './plugins/{name}'")

          # Skill names stay unique across plugins: `npx skills add -s <name>` and skl-x select by name.
          owner = {}
          for name in plugin_dirs:
              base = root / name
              dirs = sorted(p.parent.name for p in base.glob("skills/*/SKILL.md"))
              if not dirs:
                  errors.append(f"{base}: no skills/*/SKILL.md")
              for skill in dirs:
                  if skill in owner:
                      errors.append(f"skill {skill} is in both {owner[skill]} and {name}")
                  owner[skill] = name
              claude_path, codex_path = base / ".claude-plugin/plugin.json", base / ".codex-plugin/plugin.json"
              if not claude_path.is_file() or not codex_path.is_file():
                  errors.append(f"{base}: needs .claude-plugin/plugin.json and .codex-plugin/plugin.json")
                  continue
              plugin = json.loads(claude_path.read_text(encoding="utf-8"))
              codex = json.loads(codex_path.read_text(encoding="utf-8"))
              listed = sorted(s.removeprefix("./skills/") for s in plugin.get("skills", []))
              if listed != dirs:
                  errors.append(f"{claude_path} skills {listed} != {base}/skills directories {dirs}")
              if plugin.get("name") != name:
                  errors.append(f"{claude_path} name {plugin.get('name')} != directory {name}")
              if plugin.get("version") != release:
                  errors.append(f"{claude_path} version {plugin.get('version')} != CHANGELOG release {release}")
              if (codex.get("name"), codex.get("version")) != (plugin.get("name"), plugin.get("version")):
                  errors.append(f"{codex_path} name/version {codex.get('name')}/{codex.get('version')} != {claude_path} {plugin.get('name')}/{plugin.get('version')}")
              if codex.get("skills") != "./skills/":
                  errors.append(f"{codex_path} skills {codex.get('skills')!r} != './skills/'")

          for err in errors:
              print(f"::error::{err}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Compile Python scripts and examples
        run: |
          python -m compileall -q plugins/*/skills/*/scripts plugins/*/skills/*/examples

      - name: Run skill test suites
        run: |
          set -e
          for test in $(find plugins -name 'test_*.py' | sort); do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Check for hidden/bidirectional Unicode
        run: |
          # The forbidden set is defined once, as INVISIBLE_CODEPOINT_CLASS in
          # plugins/skills/skills/vitest/scripts/run_vitest.py, and read from there rather than spelled
          # again: a second copy is a copy that drifts, which is how U+061C ARABIC LETTER
          # MARK ended up in one list and not the others. It is read as source text rather
          # than imported, so this step executes none of the code it is checking. What that
          # class must contain is asserted separately, against unicodedata, in
          # test_run_vitest.py.
          python - "$RUNNER_TEMP" <<'EOF'
          import ast, pathlib, sys

          # Read the assignment, do not import the module: importing runs whatever the
          # runner does at import time, and the scanner that decides whether this
          # repository is clean should not depend on the file it is scanning executing
          # first. ast.literal_eval accepts the string literal and nothing else.
          source = pathlib.Path("plugins/skills/skills/vitest/scripts/run_vitest.py").read_text(encoding="utf-8")
          forbidden = None
          for node in ast.parse(source).body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "INVISIBLE_CODEPOINT_CLASS"
                  for target in node.targets
              ):
                  forbidden = ast.literal_eval(node.value)
          if not isinstance(forbidden, str) or not forbidden:
              print("::error::INVISIBLE_CODEPOINT_CLASS is not a string literal in run_vitest.py")
              sys.exit(1)

          codepoints, index = [], 0
          while index < len(forbidden):
              if index + 2 < len(forbidden) and forbidden[index + 1] == "-":
                  codepoints.extend(range(ord(forbidden[index]), ord(forbidden[index + 2]) + 1))
                  index += 3
              else:
                  codepoints.append(ord(forbidden[index]))
                  index += 1

          temp = pathlib.Path(sys.argv[1])
          pattern = "[" + "".join(f"\\x{{{point:04X}}}" for point in codepoints) + "]"
          temp.joinpath("bidi-pattern").write_text(pattern, encoding="utf-8")
          temp.joinpath("bidi-expected").write_text(str(len(codepoints)), encoding="utf-8")
          temp.joinpath("bidi-control").write_text(
              "".join(f"control {point:04X} before{chr(point)}after\n" for point in codepoints),
              encoding="utf-8",
          )
          EOF
          pattern=$(cat "$RUNNER_TEMP/bidi-pattern")
          expected=$(cat "$RUNNER_TEMP/bidi-expected")

          # Positive control first, one line per forbidden codepoint. This scan passes by
          # finding nothing, so a pattern or a flag that stops matching makes it silently
          # vacuous rather than noisy - the -I and --exclude-dir below were added
          # reactively and could have done exactly that. Every codepoint has to be matched
          # individually: a control that exercises one of them proves nothing about the
          # rest. The control file lives outside the checkout so the real scan never sees it.
          matched=$(grep -cPI "$pattern" "$RUNNER_TEMP/bidi-control" || true)
          if [ "$matched" != "$expected" ]; then
            echo "::error::hidden-Unicode scan matched $matched of $expected codepoints in its own positive control"
            exit 1
          fi

          # -I and --exclude-dir skip build artifacts: compiling and running the
          # suites leaves .pyc files in which a source-level \uXXXX escape appears
          # as the literal codepoint. The check is about source, not bytecode.
          #
          # The exit codes are separated rather than negated with `! grep`, which reports
          # success for both "found nothing" (1) and "the scanner failed" (2) - an
          # unreadable file or a pattern grep rejects would have passed as clean.
          status=0
          grep -rnPI --exclude-dir=__pycache__ "$pattern" plugins .claude-plugin README.md AGENTS.md CHANGELOG.md || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::hidden or bidirectional Unicode found in the files listed above"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::hidden-Unicode scan failed with exit status $status"
            exit 1
          fi
